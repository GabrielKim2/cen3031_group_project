name: Frontend checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      # Where the server tests' in-memory MongoDB binary is downloaded.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries

    # Actions are pinned to exact commits so a moved tag can't change what runs.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Cache MongoDB binary for server tests
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      - run: npm ci
      - run: npm run check
      # Runs the client tests, then the server tests.
      - run: npm test
      - run: npm run format:check
      - run: npm run build
